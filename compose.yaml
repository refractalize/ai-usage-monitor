name: ai-usage-monitor

services:
  monitor:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AI_USAGE_DB: /data/usage-v2.sqlite3
      USAGE_PROVIDERS: ${USAGE_PROVIDERS:-codex,claude}
      CODEX_USAGE_ACCOUNT_NAME: ${CODEX_USAGE_ACCOUNT_NAME:-default}
      CLAUDE_USAGE_ACCOUNT_NAME: ${CLAUDE_USAGE_ACCOUNT_NAME:-default}
      AI_USAGE_TIMEZONE: ${AI_USAGE_TIMEZONE:-UTC}
    volumes:
      - usage-data:/data
      - codex-auth:/codex-home
      - claude-auth:/home/node
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  usage-data:
  codex-auth:
  claude-auth:
