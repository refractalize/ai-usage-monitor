name: Container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ai-usage-monitor:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke-test image without subscription credentials
        run: sh scripts/container-smoke.sh ai-usage-monitor:test linux/${{ matrix.arch }}

  publish:
    if: github.event_name == 'push'
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Skip superseded main commits
        id: current
        shell: bash
        run: |
          publish=true
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            [[ "$head" == "$GITHUB_SHA" ]] || publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Image name
        if: steps.current.outputs.publish == 'true'
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: steps.current.outputs.publish == 'true'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
        if: steps.current.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.current.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: steps.current.outputs.publish == 'true'
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        if: steps.current.outputs.publish == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
      - name: Verify published platforms
        if: steps.current.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | contains(["amd64", "arm64"])'
